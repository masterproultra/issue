<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join BlackArrow</title>
  <style>
    body {
      background: #0b0f1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }

    .glow-box {
      background: #111;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 0 20px #00e3d8;
      max-width: 400px;
      margin: auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      width: 100%;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    input {
      background: #222;
      color: white;
    }

    button {
      background-color: #00e3d8;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #00c2b6;
    }
  </style>
</head>
<body>

  <div class="glow-box">
    <h2>Join BlackArrow</h2>
    <form id="join-form">
      <input type="text" name="user_name" placeholder="Your Name" required />
      <input type="email" name="user_email" placeholder="Your Email" required />
      <button type="submit">Get Started</button>
    </form>
  </div>

  <script type="module">
    import emailjs from 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';

    emailjs.init("GuV3cT8lTfVvwKEvs"); // Your public key

    document.getElementById("join-form").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = this.user_name.value;
      const email = this.user_email.value;

      emailjs.send("service_vbxob4c", "template_ot1izq8", {
        user_name: name,
        user_email: email,
      }).then(() => {
        alert("Email sent successfully!");
        this.reset();
      }, (error) => {
        alert("Failed to send email: " + JSON.stringify(error));
      });
    });
  </script>

</body>
